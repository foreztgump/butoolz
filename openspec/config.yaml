rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then format
  design:
    - Include sequence diagrams for complex flows
    - Explicitly evaluate module depth — prefer deep modules (simple interface, complex implementation)
    - Address information hiding — what design decisions does each module encapsulate?
    - Consider at least two design approaches before committing (design it twice)
    - Document dependency direction — high-level modules depend on abstractions
  tasks:
    - Each task < 2 hours
    - Include acceptance criteria
    - Specify test files to create/update
    - Include applicable code quality constraints from CODE_PRINCIPLES.md
    - Specify error handling strategy for the task's scope
  code:
    - Functions do one thing — if a function needs "and" in its description, split it
    - No magic values — all literals that aren't self-evident must be named constants
    - Prefer deep modules — simple interface, complex implementation hidden behind it
    - Error handling is mandatory for all async operations and external boundaries
    - Names reveal intent — no abbreviations, no generic names (data, info, item, temp)
    - Maximum 3 levels of nesting — use early returns, extraction, or guard clauses
    - Comments explain WHY, not WHAT — code should be self-documenting for the what
    - No duplicated logic — extract shared behavior into functions or modules
    - KISS — pick the simplest solution that works; no unnecessary patterns or indirection
    - YAGNI — only build what the task requires; no speculative abstractions
    - Law of Demeter — talk to direct collaborators only; no chaining through objects
    - Composition over inheritance — combine objects, don't extend class hierarchies

context:
  project: |
    BuTools — a gaming utility web app for Bless Unleashed PC players.
    Provides calculators, interactive maps, timers, and optimization tools.
    Monolith architecture: Next.js 16 App Router + React 19.2 + TypeScript (strict).
    Dark-mode only. Deployed via Docker on Coolify (butools.xyz), port 4001
    (Coolify injects PORT=4001 at runtime, overriding Dockerfile's ENV PORT=3000).
  architecture: |
    Feature modules live in app/features/<name>/ with components/, store/, data/, types.ts.
    Shared components in components/ (shadcn/ui in components/ui/).
    State management via Zustand stores (one per feature).
    Single API endpoint: GET /api/supporters backed by read-only SQLite at data/supporters.db.
    The supporters DB is populated by scripts/scheduler.mjs (node-cron, every 15 min)
    invoking scripts/fetchSupporters.mjs. However, the scheduler is NOT running in production:
    Dockerfile runs `node server.js` only, no separate scheduler service exists in Coolify.
    ecosystem.config.cjs (PM2 config) is dead code. The DB contains stale data.
    Map tiles served from public/BlessMap/, marker data from data/map-markers/*.json.
    ShapeDoctor uses a webpack-built web worker and requires COOP/COEP headers for SharedArrayBuffer.
  conventions: |
    PascalCase for React components, camelCase for functions/variables.
    Route directories use snake_case (runes_dreaming, gearscore_cal) for URL-friendliness.
    Conventional commits with Linear IDs: type(scope): description [TEE-XXX].
    Branches: feat/tee-XXX-description, fix/tee-XXX-description.
    Jest + ts-jest configured (jest.config.js); test coverage is minimal —
    add AAA tests alongside new code (colocate *.test.ts next to source).
